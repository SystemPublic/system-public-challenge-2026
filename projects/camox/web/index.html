<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CAMOX</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#">CAMOX</a>
    <span class="muted small tagline">Evidence from the System Graph</span>
    <button type="button" id="profile-btn" class="ghost" hidden></button>
  </header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <div id="app" class="layout"></div>

  <dialog id="profile-dialog">
    <form method="dialog" class="dialog-head">
      <h2>Profile</h2>
      <button class="ghost" value="close">Close</button>
    </form>
    <div id="profile-body"></div>
  </dialog>
</body>
</html>
