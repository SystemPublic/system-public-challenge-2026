<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Architecture</title>
<style>
  body { margin: 0; background: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg { display: block; }
  text { fill: #000; }
  .h { font-size: 25px; font-weight: 700; }
  .s { font-size: 18.5px; }
  .w { fill: #fff; }
  .y { fill: #000; }
  .cap { font-size: 17px; font-weight: 700; letter-spacing: .08em; }
</style></head><body>
<svg width="1320" height="990" viewBox="0 0 1320 990" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture: research from System's public graph and city records from NYC Open Data and the Internet Archive are held as fixed versions on the Underlay; NYC Concordance compares the versions, tests registered predictions and shows what changed.">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <rect x="2" y="2" width="1316" height="986" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="40" y="52" class="cap">SOURCES</text><text x="486" y="52" class="cap">FIXED VERSIONS</text><text x="932" y="52" class="cap">WHAT WE BUILT</text>
  <!-- sources -->
  <rect x="40" y="76" width="350" height="230" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <text x="60" y="118" class="h">System Public Graph</text>
  <text x="60" y="154" class="s">What studies report:</text><text x="60" y="180" class="s">2 million findings from</text><text x="60" y="206" class="s">840,000 studies.</text>
  <text x="60" y="250" class="s">Here: violations, sick workers</text><text x="60" y="276" class="s">and outbreaks.</text>
  <rect x="40" y="346" width="350" height="230" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <text x="60" y="388" class="h">NYC Open Data</text>
  <text x="60" y="424" class="s">The city's restaurant</text><text x="60" y="450" class="s">inspection table.</text>
  <text x="60" y="494" class="s">Rewritten every day,</text><text x="60" y="520" class="s">with no history kept.</text>
  <rect x="40" y="616" width="350" height="230" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <text x="60" y="658" class="h">Internet Archive</text>
  <text x="60" y="694" class="s">Nine yearly copies of</text><text x="60" y="720" class="s">the same table,</text><text x="60" y="746" class="s">2015 to 2026.</text>
  <text x="60" y="790" class="s">Read directly: not yet</text><text x="60" y="816" class="s">on the Underlay.</text>
  <!-- underlay -->
  <rect x="486" y="76" width="350" height="770" fill="#000" stroke="#000" stroke-width="3.5"/>
  <text x="506" y="118" class="h w">The Underlay</text>
  <text x="506" y="154" class="s w">Every collection has versions</text><text x="506" y="180" class="s w">that never change, and it</text><text x="506" y="206" class="s w">returns the difference</text><text x="506" y="232" class="s w">between two of them.</text>
  <rect x="506" y="270" width="310" height="96" fill="#000" stroke="#ffd60a" stroke-width="3"/>
  <text x="520" y="304" class="s" style="fill:#ffd60a;font-weight:700">system/public-graph</text><text x="520" y="334" class="s w">v1.0.0</text>
  <rect x="506" y="388" width="310" height="96" fill="#000" stroke="#ffd60a" stroke-width="3"/>
  <text x="520" y="422" class="s" style="fill:#ffd60a;font-weight:700">nyc/restaurant-inspections</text><text x="520" y="452" class="s w">v1.0.0 · June 2026</text>
  <rect x="506" y="506" width="310" height="122" fill="#000" stroke="#ffd60a" stroke-width="3"/>
  <text x="520" y="540" class="s" style="fill:#ffd60a;font-weight:700">system-community/</text><text x="520" y="566" class="s" style="fill:#ffd60a;font-weight:700">nyc-restaurant-inspections</text><text x="520" y="598" class="s w">v1.0.0 · November 2026 (ours)</text>
  <rect x="506" y="650" width="310" height="122" fill="#000" stroke="#ffd60a" stroke-width="3"/>
  <text x="520" y="684" class="s" style="fill:#ffd60a;font-weight:700">system-community/</text><text x="520" y="710" class="s" style="fill:#ffd60a;font-weight:700">nyc-concordance-claims</text><text x="520" y="742" class="s w">v1.2.0 · 98 tests (ours)</text>
  <!-- what we built -->
  <rect x="932" y="76" width="350" height="490" fill="#ffd60a" stroke="#000" stroke-width="3.5"/>
  <text x="952" y="118" class="h">NYC Concordance</text>
  <text x="952" y="162" class="s" style="font-weight:700">1. Compare</text><text x="952" y="188" class="s">two versions of a record,</text><text x="952" y="214" class="s">or eleven copies over time.</text>
  <text x="952" y="264" class="s" style="font-weight:700">2. Set beside the research</text><text x="952" y="290" class="s">what studies report about</text><text x="952" y="316" class="s">the same variables.</text>
  <text x="952" y="366" class="s" style="font-weight:700">3. Test</text><text x="952" y="392" class="s">a prediction written down</text><text x="952" y="418" class="s">first, checked by a referee.</text>
  <text x="952" y="468" class="s" style="font-weight:700">4. Show what changed</text><text x="952" y="494" class="s">as a table or a strip,</text><text x="952" y="520" class="s">live from the records.</text>
  <rect x="932" y="616" width="350" height="230" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <text x="952" y="658" class="h">For a city</text>
  <text x="952" y="694" class="s">What the record keeps,</text><text x="952" y="720" class="s">against what studies say</text><text x="952" y="746" class="s">causes harm.</text>
  <text x="952" y="790" class="s">Published back to the</text><text x="952" y="816" class="s">Underlay as a new version.</text>
  <!-- arrows -->
  <g stroke="#000" stroke-width="4" fill="none" marker-end="url(#a)">
    <path d="M390,191 L482,300"/><path d="M390,461 L482,440"/><path d="M215,846 L215,878 L884,878 L884,545 L928,545"/>
    <path d="M836,320 L928,250"/><path d="M836,500 L928,340"/><path d="M836,710 L928,470"/>
    <path d="M1107,566 L1107,612"/>
  </g>
  <path d="M932,104 L842,104" stroke="#000" stroke-width="4" fill="none" stroke-dasharray="10 7" marker-end="url(#a)"/>
  <text x="40" y="926" class="s">Solid arrows: data read. Dashed arrow: our results written back as a version.</text>
  <text x="40" y="958" class="s">The comparison needs fixed versions. The city's own table keeps none.</text>
</svg></body></html>
